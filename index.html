<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C4T 出勤</title>
  <!-- Cropped from the C4T mark: the source export pads the logo into ~40% of a
       1024px canvas, which shrank to an unreadable speck in a tab. -->
  <link rel="icon" type="image/png" sizes="32x32" href="uploads/favicon-32.png?v=a2-favicon-2">
  <link rel="apple-touch-icon" sizes="180x180" href="uploads/apple-touch-icon.png?v=a2-favicon-2">
  <link rel="stylesheet" href="style.css?v=a2-favicon-1">
</head>
<body>
  <div id="app"></div>

  <!-- Pure helpers (unit-tested under tests/) -->
  <!-- ?v= is bumped whenever these change: the static host serves them with
       heuristic freshness, so without it a browser keeps the previous build. -->
  <script src="lib/punch-state.js?v=a2-favicon-1"></script>
  <script src="lib/geolocation-notice.js?v=a2-favicon-1"></script>
  <script src="lib/attendance-history.js?v=a2-favicon-1"></script>
  <script src="lib/admin-dashboard.js?v=a2-favicon-1"></script>

  <!-- Application logic -->
  <script src="app.js?v=a2-favicon-1"></script>

  <!-- Runtime config (injected by deployment; publishable key only) -->
  <script src="runtime-config.js?v=a2-favicon-1"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
          crossorigin="anonymous"></script>

  <!-- Locally bundled QR encoder; activation tokens never leave the browser. -->
  <script src="uploads/vendor/qrcode.min.js"></script>

  <!-- Live auth wiring (safe no-op if Supabase unavailable) -->
  <script src="live-auth.js?v=a2-favicon-1"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C4T 出勤</title>
  <link rel="icon" type="image/png" sizes="32x32" href="uploads/c4t-universe-favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="uploads/c4t-universe-apple-touch-icon.png">

  <!-- "Add to Home Screen" used to snapshot whatever URL was in the address bar,
       so a shortcut made from a mistyped or preview host was saved forever, with
       no address bar left to reveal or correct it. The manifest pins start_url,
       so the icon always opens the real app — including when it is created from
       the "#activate=" page a staff member lands on after scanning their QR. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="C4T 出勤">

  <link rel="stylesheet" href="style.css?v=password-recovery-1">
</head>
<body>
  <div id="app"></div>

  <!-- Pure helpers (unit-tested under tests/) -->
  <!-- ?v= is bumped whenever these change: the static host serves them with
       heuristic freshness, so without it a browser keeps the previous build. -->
  <script src="lib/punch-state.js?v=punch-times-1"></script>
  <script src="lib/geolocation-notice.js?v=punch-times-1"></script>
  <script src="lib/attendance-history.js?v=punch-times-1"></script>
  <script src="lib/admin-dashboard.js?v=punch-times-1"></script>

  <!-- Application logic -->
  <script src="app.js?v=universe-logo-1"></script>

  <!-- Runtime config (injected by deployment; publishable key only) -->
  <script src="runtime-config.js?v=punch-times-1"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
          crossorigin="anonymous"></script>

  <!-- QR code generation (CDN) — no build step needed -->
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"
          crossorigin="anonymous"></script>

  <!-- Live auth wiring (safe no-op if Supabase unavailable) -->
  <script src="live-auth.js?v=password-recovery-1"></script>
</body>
</html>
